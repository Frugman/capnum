<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag | CAPNUM</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .cat-header {
            margin: 2rem 0 1.5rem;
            display: flex;
            align-items: baseline;
            gap: 1.5rem;
        }
        .cat-header h1 { margin: 0; font-size: 1.8rem; font-family: 'JetBrains Mono', monospace; }
        .cat-header a { font-size: 0.9rem; opacity: 0.7; }
        @media (max-width: 700px) { .cat-grid { grid-template-columns: 1fr; } }
        @media (min-width: 701px) and (max-width: 1000px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <header class="site-header"></header>

    <main>
        <div class="cat-header">
            <h1 id="tag-title">Articles</h1>
            <a href="index.html">← Retour à l'accueil</a>
        </div>
        <div id="tag-grid" class="cat-grid">
            <p>Chargement...</p>
        </div>
    </main>

    <footer></footer>

    <script src="js/common.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const tag = params.get('tag');
            const titleEl = document.getElementById('tag-title');
            const grid = document.getElementById('tag-grid');

            if (tag) {
                titleEl.textContent = `#${tag}`;
                document.title = `#${tag} | CAPNUM`;
            } else {
                titleEl.textContent = 'Tous les articles';
            }

            try {
                const res = await fetch('data/articles.json');
                const data = await res.json();
                let articles = data.articles.filter(a => !a.draft && a.category !== 'RANDOM');
                if (tag) articles = articles.filter(a => a.tags.includes(tag));

                if (articles.length === 0) {
                    grid.innerHTML = '<p>Aucun article avec ce mot-clé pour le moment.</p>';
                    return;
                }

                grid.innerHTML = articles.map(a => `
                    <a href="articles/${a.id}.html" class="article-card">
                        <img src="${a.image}" alt="${a.title}" class="card-image">
                        <div class="card-content">
                            <div class="card-meta">${a.category} • ${a.date}</div>
                            <h3 class="card-title">${a.title}</h3>
                            <p>${a.content.substring(0, 100).replace(/<[^>]*>/g, '')}...</p>
                        </div>
                    </a>
                `).join('');
            } catch(e) {
                grid.innerHTML = '<p>Erreur lors du chargement des articles.</p>';
            }
        });
    </script>
</body>
</html>
