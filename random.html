<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO8 - Menu Principal | CAPNUM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --to8-bg: #B2EBF2;
            --to8-dark: #008080;
            --to8-accent: #E0E0A0;
            --to8-text: #000000;
        }

        body {
            background-color: var(--to8-bg);
            color: var(--to8-text);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Barre supérieure */
        .to8-header {
            background-color: var(--to8-dark);
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 2rem;
            max-width: 900px;
        }

        .to8-logo {
            font-size: 8rem;
            color: var(--to8-bg);
            letter-spacing: -5px;
            font-weight: bold;
            line-height: 1;
        }

        .thomson-logo {
            position: absolute;
            right: 20px;
            bottom: 10px;
            font-size: 1.5rem;
            color: #000;
            font-weight: bold;
        }

        /* Infos système */
        .system-info {
            width: 900px;
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--to8-dark);
            margin-bottom: 2rem;
        }

        /* Menu */
        .menu-container {
            width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--to8-text);
            font-size: 2rem;
            transition: all 0.1s;
            cursor: pointer;
        }

        .menu-item:hover {
            color: var(--to8-dark);
            transform: translateX(10px);
        }

        .block-icon {
            width: 80px;
            height: 40px;
            background-color: var(--to8-accent);
            border: 2px solid var(--to8-dark);
            display: flex;
            flex-direction: column;
        }

        .block-icon::after {
            content: '';
            flex: 1;
            border-top: 2px solid var(--to8-dark);
        }

        /* Liste secrète */
        #random-list {
            margin-top: 2rem;
            font-size: 1.5rem;
            display: none;
        }

        #random-list a {
            color: var(--to8-dark);
            display: block;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }

        #random-list a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="to8-header">
        <div class="to8-logo">TO8</div>
        <div class="thomson-logo">THOMSON</div>
    </div>

    <div class="system-info">
        <div id="to8-date">DATE: --/--/--</div>
        <div>RAM: 512K</div>
    </div>

    <div class="menu-container">
        <div class="menu-item" onclick="pickSurprise()">
            <div class="block-icon"></div>
            <span>1 SURPRISE (ARTICLE AU HASARD)</span>
        </div>
        
        <div class="menu-item" onclick="toggleSecretList()">
            <div class="block-icon"></div>
            <span>2 ACCÈDER AUX ARCHIVES SECRÈTES</span>
        </div>

        <div class="menu-item" onclick="toggleSiteTheme()">
            <div class="block-icon"></div>
            <span>3 RÉGLAGES ET PRÉFÉRENCES</span>
        </div>

        <a href="index.html" class="menu-item">
            <div class="block-icon"></div>
            <span>4 EXPLOITATION DE FICHIERS (ACCUEIL)</span>
        </a>

        <div id="random-list">
            <p>Scanning classified data...</p>
        </div>
    </div>

    <script>
        // Date format TO8 (jj-mm-aa)
        const d = new Date();
        const formattedDate = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getFullYear()).slice(-2)}`;
        document.getElementById('to8-date').innerText = `DATE: ${formattedDate}`;

        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('data/articles.json');
                const data = await response.json();
                allArticles = data.articles;
            } catch (e) {
                console.error("Erreur chargement articles", e);
            }
        }

        function pickSurprise() {
            if (allArticles.length === 0) return;
            const randomArticle = allArticles[Math.floor(Math.random() * allArticles.length)];
            window.location.href = `articles/${randomArticle.id}.html`;
        }

        function toggleSecretList() {
            const list = document.getElementById('random-list');
            const randomArticles = allArticles.filter(a => a.category === 'RANDOM');
            
            if (list.style.display === 'block') {
                list.style.display = 'none';
            } else {
                list.style.display = 'block';
                if (randomArticles.length === 0) {
                    list.innerHTML = "<p>ERREUR: AUCUN FICHIER TROUVÉ.</p>";
                } else {
                    list.innerHTML = randomArticles.map(a => `
                        <a href="articles/${a.id}.html">> ${a.title}</a>
                    `).join('');
                }
            }
        }

        function toggleSiteTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            alert(`MODE ${next.toUpperCase()} ACTIVÉ POUR TOUT LE SITE.`);
        }

        loadArticles();
    </script>
</body>
</html>
