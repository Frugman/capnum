<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO8 - Menu Principal | CAPNUM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --to8-bg: #B2EBF2;
            --to8-dark: #008080;
            --to8-accent: #E0E0A0;
            --to8-text: #000000;
        }

        body {
            background-color: var(--to8-bg);
            color: var(--to8-text);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        .to8-header {
            background-color: var(--to8-dark);
            width: 95%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 2rem;
            max-width: 900px;
        }

        .to8-logo {
            font-size: 8rem;
            color: var(--to8-bg);
            letter-spacing: -5px;
            font-weight: bold;
            line-height: 1;
        }

        .thomson-logo {
            position: absolute;
            right: 20px;
            bottom: 10px;
            font-size: 1.5rem;
            color: #000;
            font-weight: bold;
        }

        .system-info {
            width: 95%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--to8-dark);
            margin-bottom: 1.5rem;
        }

        .menu-container {
            width: 95%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-bottom: 2rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--to8-text);
            font-size: 1.8rem;
            transition: all 0.1s;
            cursor: pointer;
        }

        .menu-item:hover {
            color: var(--to8-dark);
            transform: translateX(10px);
        }

        .block-icon {
            width: 60px;
            height: 35px;
            flex-shrink: 0;
            background-color: var(--to8-accent);
            border: 2px solid var(--to8-dark);
            display: flex;
            flex-direction: column;
        }

        .block-icon::after {
            content: '';
            flex: 1;
            border-top: 2px solid var(--to8-dark);
        }

        /* Responsive Mobile */
        @media (max-width: 700px) {
            .to8-logo { font-size: 5rem; letter-spacing: -2px; }
            .to8-header { height: 90px; }
            .thomson-logo { font-size: 1rem; bottom: 5px; right: 10px; }
            .system-info { font-size: 1.2rem; }
            .menu-item { font-size: 1.3rem; }
            .block-icon { width: 40px; height: 25px; }
            .ttt-grid { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
            .ttt-cell { font-size: 2.5rem; }
        }

        /* Tic-Tac-Toe Modal */
        #game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center; align-items: center;
            flex-direction: column;
        }

        .ttt-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: var(--to8-dark);
            padding: 5px;
        }

        .ttt-cell {
            background: var(--to8-bg);
            display: flex; justify-content: center; align-items: center;
            font-size: 4rem; cursor: pointer;
        }

        .ttt-cell:hover { background: #fff; }

        #random-list { margin-top: 1rem; font-size: 1.4rem; display: none; }
        #random-list a { color: var(--to8-dark); display: block; margin-bottom: 0.3rem; text-decoration: none; }

        .dingue { color: #d32f2f; font-weight: bold; margin-left: 20px; display: none; font-size: 1.4rem; }

    </style>
</head>
<body>

    <div class="to8-header">
        <div class="to8-logo">TO8</div>
        <div class="thomson-logo">THOMSON</div>
    </div>

    <div class="system-info">
        <div>DATE: 12-10-91</div>
        <div>RAM: 512K</div>
    </div>

    <div class="menu-container">
        <div class="menu-item" onclick="pickSurprise()">
            <div class="block-icon"></div>
            <span>1 SURPRISE (ARTICLE AU HASARD)</span>
        </div>
        
        <div class="menu-item" onclick="toggleSecretList()">
            <div class="block-icon"></div>
            <span>2 ACCÉDER AUX FICHIERS SECRETS</span>
        </div>

        <div class="menu-item" onclick="openGame()">
            <div class="block-icon"></div>
            <span>3 FAIRE UNE PARTIE DE TIC-TAC-TOE</span>
        </div>

        <div class="menu-item" onclick="launchWar()">
            <div class="block-icon"></div>
            <span>4 GUERRE THERMO-NUCLÉAIRE GLOBALE</span>
            <span id="dingue-msg" class="dingue">(NAN MAIS VOUS ÊTES DINGUE ?)</span>
        </div>

        <a href="index.html" class="menu-item">
            <div class="block-icon"></div>
            <span>5 EXPLOITATION DE FICHIERS (ACCUEIL)</span>
        </a>

        <div id="random-list"></div>
    </div>

    <div id="game-overlay">
        <h2 style="color:white; font-size: 3rem; margin-bottom: 1rem;">TIC-TAC-TOE</h2>
        <div class="ttt-grid" id="ttt-grid"></div>
        <button onclick="closeGame()" style="margin-top: 2rem; font-family: inherit; font-size: 1.5rem; padding: 0.5rem 2rem; cursor: pointer;">QUITTER</button>
        <p id="game-status" style="color:white; font-size: 2rem; margin-top: 1rem;"></p>
    </div>

    <script>
        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('data/articles.json');
                const data = await response.json();
                allArticles = data.articles;
            } catch (e) {}
        }

        function pickSurprise() {
            if (allArticles.length === 0) return;
            const randomArticle = allArticles[Math.floor(Math.random() * allArticles.length)];
            window.location.href = `articles/${randomArticle.id}.html`;
        }

        function toggleSecretList() {
            const list = document.getElementById('random-list');
            const randomArticles = allArticles
                .filter(a => a.category === 'RANDOM')
                .sort((a, b) => b.date.localeCompare(a.date));
            list.style.display = list.style.display === 'block' ? 'none' : 'block';
            if (randomArticles.length === 0) {
                list.innerHTML = "<p>ERREUR: AUCUN FICHIER TROUVÉ.</p>";
            } else {
                list.innerHTML = randomArticles.map(a => `<a href="articles/${a.id}.html">> ${a.title} (${a.date})</a>`).join('');
            }
        }

        function launchWar() {
            document.getElementById('dingue-msg').style.display = 'inline';
            setTimeout(() => { document.getElementById('dingue-msg').style.display = 'none'; }, 3000);
        }

        // --- TIC TAC TOE LOGIC ---
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;
        let currentPlayer = "X";

        function openGame() {
            document.getElementById('game-overlay').style.display = 'flex';
            resetGame();
            
            // Aléatoire : qui commence ?
            if (Math.random() > 0.5) {
                currentPlayer = "O";
                document.getElementById('game-status').innerText = "L'ORDINATEUR COMMENCE...";
                setTimeout(computerMove, 800);
            } else {
                currentPlayer = "X";
                document.getElementById('game-status').innerText = "À VOUS DE JOUER (X)";
            }
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            renderTTT();
        }

        function renderTTT() {
            const grid = document.getElementById('ttt-grid');
            grid.innerHTML = board.map((cell, i) => `
                <div class="ttt-cell" onclick="handleMove(${i})">${cell}</div>
            `).join('');
        }

        function handleMove(i) {
            if (!gameActive || board[i] !== "") return;
            board[i] = "X";
            if (checkWin("X")) {
                gameActive = false;
                document.getElementById('game-status').innerText = "X A GAGNÉ !";
            } else if (board.every(cell => cell !== "")) {
                gameActive = false;
                document.getElementById('game-status').innerText = "ÉGALITÉ !";
            } else {
                document.getElementById('game-status').innerText = "L'ORDINATEUR RÉFLÉCHIT...";
                setTimeout(computerMove, 500);
            }
            renderTTT();
        }

        function computerMove() {
            if (!gameActive) return;
            const emptyCells = board.map((c, i) => c === "" ? i : null).filter(c => c !== null);
            const move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[move] = "O";
            if (checkWin("O")) {
                gameActive = false;
                document.getElementById('game-status').innerText = "L'ORDINATEUR A GAGNÉ !";
            } else if (board.every(cell => cell !== "")) {
                gameActive = false;
                document.getElementById('game-status').innerText = "ÉGALITÉ !";
            } else {
                document.getElementById('game-status').innerText = "À VOUS DE JOUER (X)";
            }
            renderTTT();
        }

        function checkWin(p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => board[i] === p));
        }

        loadArticles();
    </script>
</body>
</html>
