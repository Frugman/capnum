<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | CAPNUM</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .cat-header {
            margin: 2rem 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .cat-header h1 { 
            margin: 0; 
            font-size: 2.2rem; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            color: var(--accent-color);
        }
        .cat-header .cat-icon {
            width: 2.8rem;
            height: 2.8rem;
            object-fit: contain;
            background: white; /* Fond blanc universel */
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cat-header a { font-size: 0.9rem; opacity: 0.7; color: var(--text-color); text-decoration: none; }
        .cat-header a:hover { text-decoration: underline; }
        
        @media (max-width: 768px) { 
            .cat-grid { grid-template-columns: 1fr; }
            .cat-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <header class="site-header"></header>

    <main>
        <div class="cat-header">
            <h1 id="cat-title">Tous les articles</h1>
            <a href="index.html">← Retour à l'accueil</a>
        </div>
        <div id="cat-grid" class="cat-grid">
            <p>Chargement...</p>
        </div>
    </main>

    <footer></footer>

    <script src="js/common.js"></script>

    <script>
        const ICONS = { 
            'Environnement': 'icoenv.svg', 
            'Data': 'icodata.svg', 
            'IA': 'icoia.svg', 
            'Low Tech': 'icolowtech.svg', 
            'Solarpunk': 'icosolar.svg', 
            'Dégafamisation': 'icodegaf.svg' 
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('cat');
            const tag = params.get('tag');
            const titleEl = document.getElementById('cat-title');
            const grid = document.getElementById('cat-grid');

            if (cat) {
                const iconFile = ICONS[cat];
                const iconHtml = iconFile ? `<img src="images/${iconFile}" class="cat-icon" alt="">` : '';
                titleEl.innerHTML = `${iconHtml}<span>${cat}</span>`;
                document.title = `${cat} | CAPNUM`;
                
                document.querySelectorAll('.main-nav a').forEach(a => {
                    if (decodeURIComponent(a.href).includes(`cat=${cat}`)) {
                        a.style.opacity = '1'; a.style.fontWeight = 'bold';
                    }
                });
            } else if (tag) {
                titleEl.innerHTML = `<span>#${tag}</span>`;
                document.title = `#${tag} | CAPNUM`;
            }

            try {
                const res = await fetch('data/articles.json');
                const data = await res.json();
                let articles = data.articles.filter(a => !a.draft && a.category !== 'RANDOM');
                
                if (cat) articles = articles.filter(a => a.category === cat);
                if (tag) articles = articles.filter(a => a.tags.includes(tag));

                if (articles.length === 0) {
                    grid.innerHTML = '<p>Aucun article trouvé pour le moment.</p>';
                    return;
                }

                grid.innerHTML = articles.map(a => `
                    <a href="articles/${a.id}.html" class="article-card">
                        <img src="${a.image}" alt="${a.title}" class="card-image">
                        <div class="card-content">
                            <h3 class="card-title">${a.title}</h3>
                            <p class="card-excerpt">${a.content.substring(0, 100).replace(/<[^>]*>/g, '')}...</p>
                            <div class="card-meta">${a.category} • ${a.date.split('-').reverse().join('/')}</div>
                        </div>
                    </a>
                `).join('');
            } catch(e) {
                grid.innerHTML = '<p>Erreur lors du chargement des articles.</p>';
            }
        });
    </script>
</body>
</html>
